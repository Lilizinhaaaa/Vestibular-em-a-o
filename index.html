<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vestibular em Ação</title>
  <meta name="description" content="Plataforma educativa para estudantes do Ensino Médio descobrirem caminhos para o Ensino Superior e organizarem sua preparação.">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">

  <!-- Aplica o tema salvo ANTES de desenhar a página (evita "piscar" de claro para escuro). -->
  <script>
    (function () {
      try {
        var saved = localStorage.getItem("vea:theme");
        var dark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.setAttribute("data-theme", saved || (dark ? "dark" : "light"));
      } catch (e) {}
    })();
  </script>

  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages/home.css">
  <link rel="stylesheet" href="css/pages/gincana.css">
</head>
<body>
  <a class="skip-link" href="#app">Pular para o conteúdo</a>

  <header id="app-header" class="site-header"></header>

  <main id="app" class="site-main" tabindex="-1">
    <noscript>
      <p class="container">Esta plataforma precisa de JavaScript ativado para funcionar.</p>
    </noscript>
  </main>

  <footer id="app-footer" class="site-footer"></footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>
